name: Deploy PortoUMKM ke GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: portoumkm-pages-deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Ambil kode
        uses: actions/checkout@v5

      - name: Kemas situs
        uses: actions/upload-pages-artifact@v5
        with:
          path: .

      - name: Tayangkan ke GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
